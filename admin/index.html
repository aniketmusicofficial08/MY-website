<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0907">
  <title>Dashboard | Aniket Patel &amp; Band Admin</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <script src="../js/supabase-config.js"></script>
</head>
<body data-page="dashboard">
  <div class="admin-shell">
    <aside class="admin-side">
      <a class="admin-brand" href="index.html">
        <span class="admin-brand__mark" aria-hidden="true">AP</span>
        <span class="admin-brand__name">Aniket Patel <i>Admin</i></span>
      </a>
      <nav class="admin-nav" aria-label="Admin sections">
        <a href="index.html" aria-current="page">Dashboard</a>
        <a href="enquiries.html">New Enquiries <span class="admin-nav__count" data-pending-count hidden>0</span></a>
        <a href="approved.html">Approved</a>
        <a href="denied.html">Denied</a>
        <a href="calendar.html">Calendar</a>
      </nav>
      <div class="admin-side__foot">
        <p class="admin-user" data-admin-email></p>
        <button class="btn btn--outline btn--full" type="button" data-logout>Logout</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-head">
        <p class="eyebrow">Overview</p>
        <h1>Booking <em>Dashboard</em></h1>
        <p>Live figures from the booking database. All times shown in Asia/Kolkata.</p>
      </header>

      <p class="notice" data-notice hidden></p>

      <section class="stat-grid" aria-label="Booking statistics">
        <article class="stat-card">
          <div class="stat-card__label">New Enquiries</div>
          <div class="stat-card__value" data-stat-pending>–</div>
        </article>
        <article class="stat-card">
          <div class="stat-card__label">Approved Bookings</div>
          <div class="stat-card__value" data-stat-approved>–</div>
        </article>
        <article class="stat-card">
          <div class="stat-card__label">Upcoming Bookings</div>
          <div class="stat-card__value" data-stat-upcoming>–</div>
        </article>
        <article class="stat-card">
          <div class="stat-card__label">Blocked Dates</div>
          <div class="stat-card__value" data-stat-blocked>–</div>
        </article>
        <article class="stat-card stat-card--alert" data-stat-email-card hidden>
          <div class="stat-card__label">Approval Emails Failed</div>
          <div class="stat-card__value" data-stat-email>0</div>
        </article>
      </section>

      <h2 class="eyebrow">Latest Enquiries</h2>
      <div class="card-list" data-recent></div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
