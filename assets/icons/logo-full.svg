<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-labelledby="ap-full-title">
  <title id="ap-full-title">Aniket Patel &amp; Band</title>
  <!-- Lock-up: monogram mark + wordmark. Vector throughout. The wordmark uses the
       site's display family with a Georgia/serif fallback, so it degrades to the same
       proportions rather than to a different silhouette. -->
