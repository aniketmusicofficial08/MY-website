    <circle cx="24" cy="24" r="22" fill="none" stroke="#d6a84f" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="18.4" fill="none" stroke="#d6a84f" stroke-width=".8" opacity=".32"/>
    <g fill="none" stroke="#f0d38a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11.5 32 17 16l5.5 16"/>
      <path d="M13.15 27.2h7.7"/>
      <path d="M28.5 32V16h4a4 4 0 0 1 0 8h-4"/>
    </g>
