  <g fill="none" stroke="#f0d38a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.5 32 17 16l5.5 16"/>
    <path d="M13.15 27.2h7.7"/>
    <path d="M28.5 32V16h4a4 4 0 0 1 0 8h-4"/>
